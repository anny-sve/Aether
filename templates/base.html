<!DOCTYPE html>
<html lang="es" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050814">
<title>{% block titulo %}Aether · Física avanzada{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: { aether: { bg: '#050814', deep: '#0a0f1d', gold: '#d4af37', glow: '#f5d77a', star: '#fffdf5' } },
      fontFamily: { display: ['Cormorant Garamond', 'serif'], sans: ['Sora', 'system-ui', 'sans-serif'] }
    }
  }
}
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/aether.css') }}">
</head>
<body class="font-sans text-slate-100 antialiased">
{% set ep = request.endpoint %}
<canvas id="campo" aria-hidden="true"></canvas>

<header class="cabecera">
  <a href="{{ url_for('index') }}" class="marca" aria-label="Aether, inicio">
    <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
      <defs>
        <linearGradient id="gm" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fffdf5"/>
          <stop offset="0.5" stop-color="#f5d77a"/>
          <stop offset="1" stop-color="#d4af37"/>
        </linearGradient>
      </defs>
      <circle cx="16" cy="16" r="14" fill="none" stroke="url(#gm)" stroke-width="1.5"/>
      <path d="M3 17 C8 5, 12 5, 16 16 S24 27, 29 15" fill="none" stroke="url(#gm)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="16" cy="16" r="2.4" fill="#fffdf5"/>
    </svg>
    <span>AETHER</span>
  </a>
  <nav class="nav-alta" aria-label="Principal">
    <a href="{{ url_for('index') }}" class="{{ 'activo' if ep in ('index', 'resultado', 'resolver') else '' }}">Resolver</a>
    <a href="{{ url_for('tracker') }}" class="{{ 'activo' if ep == 'tracker' else '' }}">Laboratorio</a>
    <a href="{{ url_for('codigo') }}" class="{{ 'activo' if ep == 'codigo' else '' }}">Código</a>
  </nav>
</header>

<main class="contenido">
  {% block contenido %}{% endblock %}
</main>

<nav class="nav-baja glass" aria-label="Navegación móvil">
  <a href="{{ url_for('index') }}" class="{{ 'activo' if ep in ('index', 'resultado', 'resolver') else '' }}">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19 L9 5 L13 14 L16 9 L20 19"/><path d="M3 19 H21"/></svg>
    <span>Resolver</span>
  </a>
  <a href="{{ url_for('tracker') }}" class="{{ 'activo' if ep == 'tracker' else '' }}">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10 L21 7 V17 L16 14"/><circle cx="9.5" cy="12" r="2"/></svg>
    <span>Laboratorio</span>
  </a>
  <a href="{{ url_for('codigo') }}" class="{{ 'activo' if ep == 'codigo' else '' }}">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 8 L3 12 L8 16"/><path d="M16 8 L21 12 L16 16"/><path d="M14 5 L10 19"/></svg>
    <span>Código</span>
  </a>
</nav>

<div id="cargando" role="status" aria-live="polite">
  <div class="orbitas" aria-hidden="true">
    <i></i><i></i><i></i><b></b>
  </div>
  <p id="cargandoTexto">Procesando…</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="{{ url_for('static', filename='js/aether.js') }}"></script>
<script src="{{ url_for('static', filename='js/render.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
